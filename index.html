<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>🚗 カスタムガレージ — 車の外装アレンジで遊ぼう！</title>
  <meta name="description" content="いろんな車の外装を自由にアレンジして遊べるサイト。カラー・ホイール・デカール・背景を選んで、あなただけの一台を作ろう！">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <h1>🔧 カスタム<span>ガレージ</span></h1>
    <p class="tagline">好きな車を、好きなだけドレスアップ。あなただけの一台を作ろう！</p>
  </header>

  <main>
    <!-- ステージ -->
    <section class="stage-section">
      <div class="stage-wrap" id="stageWrap">
        <div class="stage" id="stage" aria-live="polite"></div>
        <div class="name-plate">
          <span class="name-label">愛車ネーム</span>
          <strong id="carName"></strong>
        </div>
      </div>
      <div class="action-bar">
        <button type="button" id="gachaBtn" class="action-btn gacha">🎰 おまかせガチャ</button>
        <button type="button" id="driveBtn" class="action-btn drive">🏁 はしる！</button>
        <button type="button" id="saveBtn" class="action-btn save">💾 ガレージに保存</button>
        <button type="button" id="pngBtn" class="action-btn png">📸 PNGで保存</button>
      </div>
    </section>

    <!-- コントロールパネル -->
    <section class="panel" id="controls">

      <div class="panel-block">
        <h2>🚘 車種をえらぶ</h2>
        <div class="chip-row" id="carChips"></div>
      </div>

      <div class="panel-block">
        <h2>🎨 ボディカラー</h2>
        <div class="swatch-row">
          <span id="paintSwatches" class="swatches"></span>
          <label class="picker-label" title="好きな色を選ぶ">
            <input type="color" id="paintPicker" value="#e0342f">
            <span>＋自由な色</span>
          </label>
        </div>
        <h3>塗装の仕上げ</h3>
        <div class="chip-row" id="finishChips"></div>
      </div>

      <div class="panel-block">
        <h2>🏷️ デカール</h2>
        <div class="chip-row" id="decalChips"></div>
        <div class="swatch-row" id="accentRow">
          <span class="row-label">デカール色</span>
          <span id="accentSwatches" class="swatches"></span>
          <label class="picker-label" title="好きな色を選ぶ">
            <input type="color" id="accentPicker" value="#ffffff">
            <span>＋自由な色</span>
          </label>
        </div>
      </div>

      <div class="panel-block">
        <h2>🛞 ホイール</h2>
        <div class="chip-row" id="wheelChips"></div>
        <div class="swatch-row">
          <span class="row-label">リム色</span>
          <span id="rimSwatches" class="swatches"></span>
        </div>
      </div>

      <div class="panel-block">
        <h2>🔩 パーツ &amp; セッティング</h2>
        <div class="chip-row">
          <button type="button" id="spoilerBtn" class="chip toggle"><span class="chip-emoji">🪽</span>スポイラー</button>
          <button type="button" id="roofboxBtn" class="chip toggle"><span class="chip-emoji">🧳</span>ルーフボックス</button>
          <button type="button" id="glowBtn" class="chip toggle"><span class="chip-emoji">💡</span>ネオン</button>
          <span id="glowSwatches" class="swatches"></span>
        </div>
        <div class="slider-row">
          <label for="tintRange">🪟 窓のスモーク</label>
          <input type="range" id="tintRange" min="0" max="100" value="35">
        </div>
        <div class="slider-row">
          <label for="heightRange">📏 車高（シャコタン⇄リフトアップ）</label>
          <input type="range" id="heightRange" min="-6" max="10" step="2" value="0">
        </div>
      </div>

      <div class="panel-block">
        <h2>🌆 背景ステージ</h2>
        <div class="chip-row" id="sceneChips"></div>
      </div>

    </section>

    <!-- ギャラリー -->
    <section class="gallery-section">
      <h2>🏠 マイガレージ <span id="galleryCount" class="count"></span></h2>
      <div class="gallery" id="gallery"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>🚗 カスタムガレージ — データはこのブラウザの中だけに保存されます。思う存分カスタムしてOK！</p>
  </footer>

  <div id="toast" class="toast" role="status"></div>

  <script src="cars.js"></script>
  <script src="scenes.js"></script>
  <script src="app.js"></script>
</body>
</html>
