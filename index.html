<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ランダムポケモン</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 2rem;
      text-shadow: 0 0 20px rgba(255, 203, 5, 0.8);
      color: #ffcb05;
      letter-spacing: 2px;
    }

    #card {
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 203, 5, 0.3);
      border-radius: 24px;
      padding: 2.5rem 3rem;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      min-width: 280px;
      backdrop-filter: blur(10px);
      user-select: none;
    }

    #card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(255, 203, 5, 0.25);
      border-color: rgba(255, 203, 5, 0.7);
    }

    #card:active {
      transform: translateY(0);
    }

    #sprite-container {
      width: 160px;
      height: 160px;
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #sprite {
      width: 160px;
      height: 160px;
      image-rendering: pixelated;
      filter: drop-shadow(0 4px 12px rgba(255, 203, 5, 0.4));
      display: none;
    }

    .pokeball-icon {
      width: 80px;
      height: 80px;
      opacity: 0.4;
    }

    #name {
      font-size: 1.8rem;
      font-weight: 700;
      text-transform: capitalize;
      color: #fff;
      min-height: 2.2rem;
      margin-bottom: 0.5rem;
    }

    #number {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 1rem;
      min-height: 1.2rem;
    }

    #types {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
      min-height: 1.8rem;
      margin-bottom: 1.5rem;
    }

    .type-badge {
      padding: 0.25rem 0.9rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #hint {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.45);
      margin-top: 0.5rem;
    }

    #loading {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 203, 5, 0.2);
      border-top-color: #ffcb05;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.6);
    }

    #stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .stat-item {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 0.4rem 0.6rem;
    }

    .stat-label {
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: 600;
      color: #ffcb05;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>
  <h1>ランダムポケモン</h1>

  <div id="card" onclick="fetchRandomPokemon()">
    <div id="sprite-container">
      <svg class="pokeball-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="48" stroke="white" stroke-width="4"/>
        <path d="M2 50 Q2 2 50 2 Q98 2 98 50" fill="rgba(255,50,50,0.6)"/>
        <path d="M2 50 Q2 98 50 98 Q98 98 98 50" fill="rgba(255,255,255,0.1)"/>
        <line x1="2" y1="50" x2="98" y2="50" stroke="white" stroke-width="4"/>
        <circle cx="50" cy="50" r="14" fill="white" stroke="white" stroke-width="4"/>
        <circle cx="50" cy="50" r="8" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
      </svg>
      <img id="sprite" alt="pokemon sprite" />
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <div class="loading-text">読み込み中...</div>
    </div>

    <div id="name"></div>
    <div id="number"></div>
    <div id="types"></div>
    <div id="stats"></div>

    <div id="hint">クリックしてランダムポケモンを表示</div>
  </div>

  <footer>Powered by PokéAPI</footer>

  <script>
    const TYPE_COLORS = {
      normal: '#A8A878', fire: '#F08030', water: '#6890F0',
      electric: '#F8D030', grass: '#78C850', ice: '#98D8D8',
      fighting: '#C03028', poison: '#A040A0', ground: '#E0C068',
      flying: '#A890F0', psychic: '#F85888', bug: '#A8B820',
      rock: '#B8A038', ghost: '#705898', dragon: '#7038F8',
      dark: '#705848', steel: '#B8B8D0', fairy: '#EE99AC',
    };

    const TOTAL_POKEMON = 1025;

    async function fetchRandomPokemon() {
      const card = document.getElementById('card');
      const loading = document.getElementById('loading');
      const sprite = document.getElementById('sprite');
      const pokeballIcon = document.querySelector('.pokeball-icon');
      const nameEl = document.getElementById('name');
      const numberEl = document.getElementById('number');
      const typesEl = document.getElementById('types');
      const statsEl = document.getElementById('stats');
      const hint = document.getElementById('hint');

      card.style.pointerEvents = 'none';
      loading.style.display = 'flex';
      sprite.style.display = 'none';
      pokeballIcon.style.display = 'none';
      nameEl.textContent = '';
      numberEl.textContent = '';
      typesEl.innerHTML = '';
      statsEl.innerHTML = '';
      hint.textContent = '';

      const id = Math.floor(Math.random() * TOTAL_POKEMON) + 1;

      try {
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
        if (!res.ok) throw new Error('fetch failed');
        const data = await res.json();

        const spriteUrl =
          data.sprites.other?.['official-artwork']?.front_default ||
          data.sprites.front_default;

        loading.style.display = 'none';

        if (spriteUrl) {
          sprite.src = spriteUrl;
          sprite.style.display = 'block';
        } else {
          pokeballIcon.style.display = 'block';
        }

        nameEl.textContent = data.name;
        numberEl.textContent = `No. ${String(data.id).padStart(4, '0')}`;

        typesEl.innerHTML = data.types.map(t => {
          const color = TYPE_COLORS[t.type.name] || '#888';
          return `<span class="type-badge" style="background:${color}">${t.type.name}</span>`;
        }).join('');

        const statMap = { hp: 'HP', attack: '攻撃', defense: '防御', speed: '素早さ', 'special-attack': '特攻', 'special-defense': '特防' };
        const wantedStats = ['hp', 'attack', 'defense', 'speed'];
        statsEl.innerHTML = data.stats
          .filter(s => wantedStats.includes(s.stat.name))
          .map(s => `
            <div class="stat-item">
              <div class="stat-label">${statMap[s.stat.name] || s.stat.name}</div>
              <div class="stat-value">${s.base_stat}</div>
            </div>
          `).join('');

        hint.textContent = 'もう一度クリックで次のポケモン';
      } catch (e) {
        loading.style.display = 'none';
        pokeballIcon.style.display = 'block';
        nameEl.textContent = 'エラーが発生しました';
        hint.textContent = 'クリックして再試行';
      }

      card.style.pointerEvents = 'auto';
    }
  </script>
</body>
</html>
