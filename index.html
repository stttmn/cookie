<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ランダムポケモン</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 2rem;
      text-shadow: 0 0 20px rgba(255, 203, 5, 0.8);
      color: #ffcb05;
      letter-spacing: 2px;
    }

    #card {
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 203, 5, 0.3);
      border-radius: 24px;
      padding: 2.5rem 3rem;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      min-width: 280px;
      backdrop-filter: blur(10px);
      user-select: none;
    }

    #card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(255, 203, 5, 0.25);
      border-color: rgba(255, 203, 5, 0.7);
    }

    #card:active {
      transform: translateY(0);
    }

    #sprite-container {
      width: 160px;
      height: 160px;
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #sprite {
      width: 160px;
      height: 160px;
      image-rendering: pixelated;
      filter: drop-shadow(0 4px 12px rgba(255, 203, 5, 0.4));
      display: none;
    }

    .pokeball-icon {
      width: 80px;
      height: 80px;
      opacity: 0.4;
    }

    #name {
      font-size: 1.8rem;
      font-weight: 700;
      text-transform: capitalize;
      color: #fff;
      min-height: 2.2rem;
      margin-bottom: 0.5rem;
    }

    #number {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 1rem;
      min-height: 1.2rem;
    }

    #types {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
      min-height: 1.8rem;
      margin-bottom: 1.5rem;
    }

    .type-badge {
      padding: 0.25rem 0.9rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #hint {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.45);
      margin-top: 0.5rem;
    }

    #loading {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 203, 5, 0.2);
      border-top-color: #ffcb05;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.6);
    }

    #stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .stat-item {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 0.4rem 0.6rem;
    }

    .stat-label {
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: 600;
      color: #ffcb05;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>
  <h1>ランダムポケモン</h1>

  <div id="card" onclick="fetchRandomPokemon()">
    <div id="sprite-container">

        <circle cx="50" cy="50" r="48" stroke="white" stroke-width="4"/>
        <path d="M2 50 Q2 2 50 2 Q98 2 98 50" fill="rgba(255,50,50,0.6)"/>

        <circle cx="50" cy="50" r="14" fill="white" stroke="white" stroke-width="4"/>
        <circle cx="50" cy="50" r="8" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
      </svg>
      <img id="sprite" alt="pokemon sprite" />
    </div>

    <div id="loading">
      <div class="spinner"></div>

    <div id="name"></div>

    const TOTAL_POKEMON = 1025;

    function makeSvgSprite(primaryType) {
      const c = TYPE_COLORS[primaryType] || '#888';
      const svg = `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="bg" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="${c}" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="${c}" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="body" cx="40%" cy="35%" r="65%">
            <stop offset="0%" stop-color="${c}ff"/>
            <stop offset="100%" stop-color="${c}99"/>
          </radialGradient>
        </defs>
        <circle cx="60" cy="60" r="58" fill="url(#bg)"/>
        <circle cx="60" cy="44" r="28" fill="url(#body)"/>
        <ellipse cx="60" cy="80" rx="34" ry="26" fill="url(#body)"/>
        <circle cx="50" cy="40" r="6" fill="white"/>
        <circle cx="70" cy="40" r="6" fill="white"/>
        <circle cx="51" cy="40" r="3" fill="#1a1a2e"/>
        <circle cx="71" cy="40" r="3" fill="#1a1a2e"/>
        <circle cx="49" cy="37" r="1.8" fill="white" opacity="0.6"/>
        <circle cx="69" cy="37" r="1.8" fill="white" opacity="0.6"/>
        <path d="M54 53 Q60 58 66 53" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <ellipse cx="36" cy="54" rx="9" ry="6" fill="${c}" opacity="0.6" transform="rotate(-25 36 54)"/>
        <ellipse cx="84" cy="54" rx="9" ry="6" fill="${c}" opacity="0.6" transform="rotate(25 84 54)"/>
      </svg>`;
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    function showPokemon(data) {
      const sprite = document.getElementById('sprite');
      const pokeballIcon = document.querySelector('.pokeball-icon');
      const nameEl = document.getElementById('name');
      const numberEl = document.getElementById('number');
      const typesEl = document.getElementById('types');
      const statsEl = document.getElementById('stats');
      const hint = document.getElementById('hint');

      const spriteUrl = data.spriteUrl || makeSvgSprite(data.types[0]);
      sprite.src = spriteUrl;
      sprite.style.display = 'block';
      pokeballIcon.style.display = 'none';

      nameEl.textContent = data.name;
      numberEl.textContent = `No. ${String(data.id).padStart(4, '0')}`;

      typesEl.innerHTML = data.types.map(t => {
        const color = TYPE_COLORS[t] || '#888';
        return `<span class="type-badge" style="background:${color}">${t}</span>`;
      }).join('');

      const statMap = { hp: 'HP', attack: '攻撃', defense: '防御', speed: '素早さ' };
      statsEl.innerHTML = ['hp', 'attack', 'defense', 'speed'].map(s => `
        <div class="stat-item">
          <div class="stat-label">${statMap[s]}</div>
          <div class="stat-value">${data[s]}</div>
        </div>
      `).join('');

      hint.textContent = 'もう一度クリックで次のポケモン';
    }

    async function fetchRandomPokemon() {
      const card = document.getElementById('card');
      const loading = document.getElementById('loading');
      const sprite = document.getElementById('sprite');
      const pokeballIcon = document.querySelector('.pokeball-icon');
      const nameEl = document.getElementById('name');
      const numberEl = document.getElementById('number');
      const typesEl = document.getElementById('types');
      const statsEl = document.getElementById('stats');
      const hint = document.getElementById('hint');

      card.style.pointerEvents = 'none';
      loading.style.display = 'flex';
      sprite.style.display = 'none';
      pokeballIcon.style.display = 'none';
      nameEl.textContent = '';
      numberEl.textContent = '';
      typesEl.innerHTML = '';
      statsEl.innerHTML = '';
      hint.textContent = '';

      const id = Math.floor(Math.random() * TOTAL_POKEMON) + 1;

      try {
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
        if (!res.ok) throw new Error('fetch failed');
        const apiData = await res.json();

        const spriteUrl =
          apiData.sprites.other?.['official-artwork']?.front_default ||
          apiData.sprites.front_default;

        loading.style.display = 'none';

        const statValues = {};
        apiData.stats.forEach(s => { statValues[s.stat.name] = s.base_stat; });

        showPokemon({
          id: apiData.id,
          name: apiData.name,
          types: apiData.types.map(t => t.type.name),
          spriteUrl,
          hp: statValues.hp,
          attack: statValues.attack,
          defense: statValues.defense,
          speed: statValues.speed,
        });
      } catch (e) {
        const local = LOCAL_POKEMON[Math.floor(Math.random() * LOCAL_POKEMON.length)];
        loading.style.display = 'none';
        showPokemon(local);
      }

      card.style.pointerEvents = 'auto';
    }
  </script>
